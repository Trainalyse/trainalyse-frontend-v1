<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- interactive-widget=resizes-content: when the mobile keyboard opens, shrink
         the LAYOUT viewport (not just the visual one) so position:fixed elements —
         e.g. the range-warning toast — reposition into the visible area instead of
         being parked off-screen above the scroll (a Chrome-Android quirk). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Kasrat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
